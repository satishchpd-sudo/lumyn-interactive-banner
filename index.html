
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumyn | Global Growth</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #07111f;
  font-family: Arial, sans-serif;
}

#hero {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 440px;
  overflow: hidden;
  color: white;
  background:
    radial-gradient(ellipse at 72% 48%, #142a43 0%, #091626 42%, #050b14 100%);
}

#globe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#particles {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.copy {
  position: absolute;
  z-index: 2;
  left: 7%;
  top: 50%;
  transform: translateY(-50%);
  width: 44%;
  pointer-events: none;
}

.eyebrow {
  color: #d9b66b;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 4px;
  text-transform: uppercase;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(35px, 5vw, 70px);
  line-height: 1.06;
  font-weight: 400;
  margin: 20px 0;
}

h1 span { color: #dfbd76; }

.description {
  color: #c1cbd8;
  font-size: clamp(13px, 1.35vw, 17px);
  line-height: 1.8;
  max-width: 390px;
}

.cta {
  display: inline-block;
  margin-top: 22px;
  padding: 14px 22px;
  border: 1px solid #c9a65f;
  color: #f3dba4;
  font-size: 11px;
  letter-spacing: 2px;
  text-decoration: none;
  pointer-events: auto;
}

.cta:hover { background: #c9a65f; color: #07111f; }

.footer {
  position: absolute;
  bottom: 20px;
  left: 7%;
  color: #8090a3;
  font-size: 9px;
  letter-spacing: 2px;
  z-index: 2;
}

@media (max-width: 650px) {
  .copy {
    top: 8%;
    transform: none;
    left: 7%;
    width: 86%;
  }
  h1 { font-size: 38px; margin: 12px 0; }
  .description { max-width: 310px; }
  .cta { margin-top: 10px; padding: 10px 14px; }
  .footer { bottom: 12px; }
}
</style>
</head>

<body>
<section id="hero">
  <canvas id="globe"></canvas>
  <canvas id="particles"></canvas>

  <div class="copy">
    <div class="eyebrow">Lumyn Business Consulting</div>
    <h1>Think Beyond<br>Boundaries.<br><span>Scale Globally.</span></h1>
    <p class="description">
      Turning marketplace potential into sustainable brand growth
      across borders.
    </p>
    <a class="cta" href="https://lumynconsulting.in/">
      DISCOVER LUMYN &nbsp; ↗
    </a>
  </div>

  <div class="footer">STRATEGY &nbsp; · &nbsp; ACCELERATION &nbsp; · &nbsp; GROWTH</div>
</section>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const canvas = document.querySelector("#globe");
const hero = document.querySelector("#hero");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.z = 5.4;

const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha: true,
  antialias: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

scene.add(new THREE.AmbientLight(0xffffff, 2.0));

const light = new THREE.DirectionalLight(0xffffff, 3.0);
light.position.set(-3, 2, 5);
scene.add(light);

const globeGroup = new THREE.Group();
scene.add(globeGroup);

const textureLoader = new THREE.TextureLoader();
const earthUrl =
  "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg";

textureLoader.load(
  earthUrl,
  texture => {
    texture.colorSpace = THREE.SRGBColorSpace;
    earth.material.map = texture;
    earth.material.needsUpdate = true;
  },
  undefined,
  () => {
    console.warn("Earth texture unavailable; using the blue globe.");
  }
);

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1.35, 64, 64),
  new THREE.MeshStandardMaterial({
    color: 0x6388a8,
    roughness: 1,
    metalness: 0
  })
);
globeGroup.add(earth);

// Blue atmospheric halo
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.40, 48, 48),
  new THREE.MeshBasicMaterial({
    color: 0x4c9ce8,
    transparent: true,
    opacity: 0.13,
    side: THREE.BackSide
  })
);
globeGroup.add(atmosphere);

// Gold route around the Earth
function globePoint(lat, lon, radius = 1.37) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;

  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
     radius * Math.cos(phi),
     radius * Math.sin(phi) * Math.sin(theta)
  );
}

const routePoints = [];
for (let i = 0; i <= 100; i++) {
  const t = i / 100;

  // Curved route connecting two approximate global locations
  const lat = 20 + 25 * Math.sin(t * Math.PI);
  const lon = -120 + 240 * t;

  routePoints.push(globePoint(lat, lon));
}

const routeCurve = new THREE.CatmullRomCurve3(routePoints);
const routeGeometry = new THREE.BufferGeometry().setFromPoints(
  routeCurve.getPoints(180)
);

const route = new THREE.Line(
  routeGeometry,
  new THREE.LineBasicMaterial({
    color: 0xe4bd6d,
    transparent: true,
    opacity: 0.9
  })
);
globeGroup.add(route);

// Draw a tiny aeroplane on a transparent canvas
const planeCanvas = document.createElement("canvas");
planeCanvas.width = 128;
planeCanvas.height = 128;

const pctx = planeCanvas.getContext("2d");
pctx.translate(64, 64);
pctx.fillStyle = "#f5d38c";
pctx.shadowColor = "#edc477";
pctx.shadowBlur = 15;

pctx.beginPath();
pctx.moveTo(0, -52);
pctx.lineTo(10, -7);
pctx.lineTo(43, 15);
pctx.lineTo(43, 23);
pctx.lineTo(9, 14);
pctx.lineTo(7, 38);
pctx.lineTo(18, 46);
pctx.lineTo(18, 51);
pctx.lineTo(0, 46);
pctx.lineTo(-18, 51);
pctx.lineTo(-18, 46);
pctx.lineTo(-7, 38);
pctx.lineTo(-9, 14);
pctx.lineTo(-43, 23);
pctx.lineTo(-43, 15);
pctx.lineTo(-10, -7);
pctx.closePath();
pctx.fill();

const planeTexture = new THREE.CanvasTexture(planeCanvas);
const plane = new THREE.Sprite(
  new THREE.SpriteMaterial({
    map: planeTexture,
    transparent: true,
    depthTest: false
  })
);
plane.scale.set(0.30, 0.30, 1);
plane.renderOrder = 5;
globeGroup.add(plane);

// Stars in the background
const starPositions = [];
for (let i = 0; i < 350; i++) {
  starPositions.push(
    (Math.random() - 0.5) * 13,
    (Math.random() - 0.5) * 8,
    -2 - Math.random() * 5
  );
}

const starsGeometry = new THREE.BufferGeometry();
starsGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions, 3)
);

scene.add(new THREE.Points(
  starsGeometry,
  new THREE.PointsMaterial({
    color: 0xc8d9eb,
    size: 0.018,
    transparent: true,
    opacity: 0.65
  })
));

// Cursor position gently influences the globe
let mouseX = 0;
let mouseY = 0;
let smoothX = 0;
let smoothY = 0;

hero.addEventListener("pointermove", event => {
  const rect = hero.getBoundingClientRect();
  mouseX = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
  mouseY = ((event.clientY - rect.top) / rect.height - 0.5) * 2;
});

hero.addEventListener("pointerleave", () => {
  mouseX = 0;
  mouseY = 0;
});

function resize() {
  const w = hero.clientWidth;
  const h = hero.clientHeight;

  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < 650 ? 48 : 38;
  camera.position.z = w < 650 ? 6.3 : 5.4;
  camera.updateProjectionMatrix();

  // Keep the Earth to the right of the text on desktop
  globeGroup.position.x = w < 650 ? 0.55 : 1.15;
  globeGroup.position.y = w < 650 ? -1.05 : 0;
}
new ResizeObserver(resize).observe(hero);
resize();

// Gold sparks follow the cursor
const particleCanvas = document.querySelector("#particles");
const ctx = particleCanvas.getContext("2d");
let particles = [];
let px = 0;
let py = 0;

function resizeParticles() {
  const rect = hero.getBoundingClientRect();
  particleCanvas.width = Math.round(rect.width * Math.min(devicePixelRatio, 2));
  particleCanvas.height = Math.round(rect.height * Math.min(devicePixelRatio, 2));
  particleCanvas.style.width = rect.width + "px";
  particleCanvas.style.height = rect.height + "px";
}
new ResizeObserver(resizeParticles).observe(hero);
resizeParticles();

hero.addEventListener("pointermove", event => {
  const rect = hero.getBoundingClientRect();
  px = event.clientX - rect.left;
  py = event.clientY - rect.top;

  for (let i = 0; i < 3; i++) {
    particles.push({
      x: px,
      y: py,
      vx: (Math.random() - 0.5) * 2.2,
      vy: (Math.random() - 0.5) * 2.2,
      life: 1,
      size: Math.random() * 2.6 + 0.5
    });
  }
});

function animate() {
  requestAnimationFrame(animate);

  smoothX += (mouseX - smoothX) * 0.035;
  smoothY += (mouseY - smoothY) * 0.035;

  globeGroup.rotation.y += 0.0018;
  globeGroup.rotation.y += smoothX * 0.0008;
  globeGroup.rotation.x = smoothY * 0.10;

  const t = (performance.now() * 0.000045) % 1;
  const position = routeCurve.getPointAt(t);
  plane.position.copy(position);

  const next = routeCurve.getPointAt((t + 0.005) % 1);
  const a = position.clone().project(camera);
  const b = next.clone().project(camera);
  plane.material.rotation = Math.atan2(b.y - a.y, b.x - a.x) - Math.PI / 2;

  renderer.render(scene, camera);

  const dpr = Math.min(devicePixelRatio, 2);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, hero.clientWidth, hero.clientHeight);

  particles = particles.filter(p => p.life > 0.02);

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.015;
    p.life *= 0.94;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(235, 190, 104, ${p.life})`;
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#e7b95f";
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

animate();
</script>
</body>
</html>
